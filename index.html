<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>rorrim</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%AA%9E%3C/text%3E%3C/svg%3E">
<meta name="description" content="abcdefghijklmnopqrstuvwxyz.llc, in the mirror.">
<style>
  /* The mirror (user, 2026-10-19): the live site, flipped left to right. Nothing here is copied, so it is
     always whatever the real site is right now. The frame's name, "mirror", stays with every page loaded in
     it; the user's own sites read it and keep their links inside (mirror.js on abcdefghijklmnopqrstuvwxyz.llc). */
  html, body { margin: 0; height: 100%; background: #fbfaf7; }
  @media (prefers-color-scheme: dark) { html, body { background: #111; } }
  iframe { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; transform: scaleX(-1); }
  noscript p { font: 14px/1.5 ui-monospace, Menlo, monospace; padding: 2rem 16px; color: #6b6b6b; transform: scaleX(-1); }
</style>
</head>
<body>
<iframe name="mirror" title="abcdefghijklmnopqrstuvwxyz.llc, in the mirror"></iframe>
<noscript><p>The mirror needs JavaScript. The unflipped site is <a href="https://abcdefghijklmnopqrstuvwxyz.llc/">abcdefghijklmnopqrstuvwxyz.llc</a>.</p></noscript>
<script>
  // Which site and page to show: a path here is the same path there, and the first part of the path can name
  // one of the user's other sites (…/badvice/r173/ mirrors badvice.fyi/r173/).
  (() => {
    "use strict";
    const SITES = { badvice: "https://badvice.fyi", listslists: "https://listslists.xyz", toomanybios: "https://toomanybios.com" };
    const HOME = "https://abcdefghijklmnopqrstuvwxyz.llc";
    const parts = location.pathname.split("/");
    let base = HOME, path = location.pathname;
    if (SITES[parts[1]]) { base = SITES[parts[1]]; path = "/" + parts.slice(2).join("/"); }
    document.querySelector("iframe").src = base + path + location.search + location.hash;
  })();
</script>
</body>
</html>
